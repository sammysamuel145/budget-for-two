<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget for Two</title>
<style>
:root{--bg:#fff;--text:#14213d;--muted:#3d4a63;--accent:#0b5563;--on-accent:#fff;--card:#f1f4f9;--line:#c9d1de;--bad:#9b1c1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--text:#f2f5fa;--muted:#c3cbdb;--accent:#7fd6e6;--on-accent:#0f1626;--card:#1a2338;--line:#34405a;--bad:#ff9d9d}}
:root[data-theme="dark"]{--bg:#0f1626;--text:#f2f5fa;--muted:#c3cbdb;--accent:#7fd6e6;--on-accent:#0f1626;--card:#1a2338;--line:#34405a;--bad:#ff9d9d}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Verdana,Arial,sans-serif;line-height:1.5}
main{max-width:36rem;margin:0 auto;padding:1.25rem}
h1{font-size:1.6rem;margin:0 0 .5rem}
h2{font-size:1.15rem;margin:1.75rem 0 .75rem}
label,legend{font-weight:700}
label{display:block;margin-bottom:.25rem}
input,select,button{font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--text);border-radius:.4rem;padding:.6rem .7rem;min-height:44px;width:100%}
button{cursor:pointer;font-weight:700}
.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:4px solid var(--text);outline-offset:3px}
.field{margin-bottom:.9rem}
fieldset{border:2px solid var(--line);border-radius:.5rem;padding:.6rem .9rem;margin:0}
.who label{display:flex;align-items:center;gap:.6rem;font-weight:400;min-height:44px;margin:0}
.who input{width:1.4rem;min-height:0;height:1.4rem}
#status{color:var(--muted);margin:0 0 1rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:.55rem .3rem;border-bottom:1px solid var(--line);font-size:.9rem}
th:first-child,td:first-child{text-align:left}
.over{color:var(--bad);font-weight:700}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
li small{display:block;color:var(--muted)}
li button{width:auto;padding:.4rem .8rem}
.empty{color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Budget for Two</h1>
<p id="status" role="status">Connecting…</p>

<section id="welcome" hidden>
<h2>Start a shared budget</h2>
<button class="primary" id="newBtn" type="button">Start a new budget</button>
<h2>Or join your partner</h2>
<div class="field"><label for="joinCode">Invitation code</label><input id="joinCode" type="text" maxlength="12" autocomplete="off" autocapitalize="characters" placeholder="e.g. AB3K-9XQM"></div>
<p id="joinErr" role="alert" class="over" style="min-height:1.5rem;margin:0 0 .5rem"></p>
<button id="joinBtn" type="button">Join</button>
</section>

<section id="invite" hidden>
<p style="margin:0 0 .5rem">Invitation code: <strong id="inviteCode" style="font-size:1.3rem;letter-spacing:.08em"></strong></p>
<div style="display:flex;gap:.6rem"><button id="copyBtn" type="button">Copy invite message</button><button id="leaveBtn" type="button">Leave</button></div>
</section>

<div id="app" hidden>
<fieldset class="who" id="who">
<legend>Who are you on this device?</legend>
<label><input type="radio" name="me" value="a"><span id="nameA">Person A</span></label>
<label><input type="radio" name="me" value="b"><span id="nameB">Person B</span></label>
</fieldset>

<section id="mine" hidden>
<h2>Your details</h2>
<div class="field"><label for="myname">Your name</label><input id="myname" type="text" maxlength="30" autocomplete="off"></div>
<div class="field"><label for="myinc">Your monthly income (Rp)</label><input id="myinc" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 5000000"></div>
</section>

<h2>Summary</h2>
<table>
<caption style="position:absolute;left:-9999px">Income, spending, and money left for each person</caption>
<thead><tr><th scope="col">Person</th><th scope="col">Income</th><th scope="col">Spent</th><th scope="col">Left</th></tr></thead>
<tbody id="rows"></tbody>
</table>

<section id="addbox" hidden>
<h2>Add an expense</h2>
<form id="form" novalidate>
<div class="field"><label for="desc">What was it for?</label><input id="desc" type="text" maxlength="60" placeholder="e.g. Groceries" autocomplete="off"></div>
<div class="field"><label for="amt">Amount (Rp)</label><input id="amt" type="number" inputmode="decimal" min="0" step="1" placeholder="e.g. 50000"></div>
<div class="field"><label for="cat">Category</label>
<select id="cat"><option>Housing</option><option>Food</option><option>Transport</option><option>Bills</option><option>Fun</option><option>Other</option></select></div>
<p id="err" role="alert" class="over" style="min-height:1.5rem;margin:0 0 .5rem"></p>
<button class="primary" type="submit">Add expense</button>
</form>
</section>

<h2>All expenses</h2>
<ul id="list"></ul>
</div>
</main>
<script>
var $=function(id){return document.getElementById(id)};
var people={a:{name:"",income:0},b:{name:"",income:0}},expenses=[],me=null,store=null;
try{me=localStorage.getItem("budget2-me")}catch(e){}
if(me!=="a"&&me!=="b")me=null;

function money(n){return n.toLocaleString("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0})}
function nm(k){return people[k].name||("Person "+k.toUpperCase())}
function say(t){$("status").textContent=t}
function fail(e){if(!e||e.message!=="auth")say("Couldn't save that. Check your connection and try again.")}

function render(){
  $("nameA").textContent=nm("a");$("nameB").textContent=nm("b");
  document.querySelectorAll('input[name="me"]').forEach(function(r){r.checked=(r.value===me)});
  $("mine").hidden=!me;$("addbox").hidden=!me;
  if(me){
    if(document.activeElement!==$("myname"))$("myname").value=people[me].name||"";
    if(document.activeElement!==$("myinc"))$("myinc").value=people[me].income||"";
  }
  var rows=$("rows");rows.innerHTML="";
  var tot={inc:0,sp:0};
  ["a","b"].forEach(function(k){
    var sp=expenses.filter(function(e){return e.who===k}).reduce(function(s,e){return s+e.amt},0);
    var inc=Number(people[k].income)||0;tot.inc+=inc;tot.sp+=sp;
    addRow(rows,nm(k),inc,sp);
  });
  addRow(rows,"Together",tot.inc,tot.sp);
  var ul=$("list");ul.innerHTML="";
  if(!expenses.length){var li=document.createElement("li");li.className="empty";li.textContent="No expenses yet.";ul.appendChild(li)}
  expenses.forEach(function(it){
    var li=document.createElement("li"),box=document.createElement("div");
    var t=document.createElement("strong");t.textContent=money(it.amt)+" "+it.desc;
    var s=document.createElement("small");
    s.textContent=nm(it.who)+" · "+it.cat+" · "+new Date(it.ts).toLocaleDateString("id-ID");
    box.appendChild(t);box.appendChild(s);li.appendChild(box);
    if(it.who===me){
      var b=document.createElement("button");b.type="button";b.textContent="Delete";
      b.setAttribute("aria-label","Delete "+it.desc+", "+money(it.amt));
      b.addEventListener("click",function(){store.delExpense(it.id).then(function(){say("Deleted "+it.desc+".")}).catch(fail)});
      li.appendChild(b);
    }
    ul.appendChild(li);
  });
}
function addRow(body,name,inc,sp){
  var tr=document.createElement("tr"),left=inc-sp;
  var th=document.createElement("th");th.scope="row";th.textContent=name;tr.appendChild(th);
  [money(inc),money(sp),(left<0?"Over by "+money(-left):money(left))].forEach(function(v,i){
    var td=document.createElement("td");td.textContent=v;if(i===2&&left<0)td.className="over";tr.appendChild(td);
  });
  body.appendChild(tr);
}

var code="",timer=null,lastJSON="",pcb=function(){},ecb=function(){};
try{code=localStorage.getItem("budget2-invite")||""}catch(e){}
function fmt(c){return c.slice(0,4)+"-"+c.slice(4)}
function norm(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function api(method,path,body){
  return fetch(path,{method:method,headers:{"Content-Type":"application/json","x-invite-code":code},body:body?JSON.stringify(body):undefined}).then(function(r){
    if(r.status===401)throw new Error("auth");
    if(!r.ok)throw new Error("http "+r.status);
    return r.status===204?null:r.json();
  });
}
function pull(){
  return api("GET","/api/data").then(function(d){
    var j=JSON.stringify(d);if(j===lastJSON)return;lastJSON=j;
    pcb(d.people);ecb(d.expenses);
  }).catch(function(e){
    if(e.message==="auth")showWelcome("That invitation code isn't valid.");
    else say("Can't reach the server. Retrying...");
  });
}
store={
  onPeople:function(cb){pcb=cb},
  onExpenses:function(cb){ecb=cb},
  addExpense:function(o){return api("POST","/api/expenses",o).then(pull)},
  delExpense:function(id){return api("DELETE","/api/expenses/"+id).then(pull)},
  setPerson:function(k,o){return api("PUT","/api/people/"+k,o).then(pull)}
};
function showWelcome(msg){
  clearInterval(timer);timer=null;code="";lastJSON="";me=null;
  try{localStorage.removeItem("budget2-invite");localStorage.removeItem("budget2-me")}catch(e){}
  people={a:{name:"",income:0},b:{name:"",income:0}};expenses=[];
  $("app").hidden=true;$("invite").hidden=true;$("welcome").hidden=false;
  say(msg||"Start a new budget, or join with your partner's invitation code.");
}
function enter(c){
  code=c;lastJSON="";
  try{localStorage.setItem("budget2-invite",c)}catch(e){}
  $("welcome").hidden=true;$("app").hidden=false;$("invite").hidden=false;$("inviteCode").textContent=fmt(c);
  store.onPeople(function(p){["a","b"].forEach(function(k){people[k]=Object.assign({name:"",income:0},p[k])});render()});
  store.onExpenses(function(list){expenses=list;render()});
  say("Shared budget. You both see the same numbers, updated every few seconds.");
  render();clearInterval(timer);pull();
  timer=setInterval(function(){if(!document.hidden)pull()},5000);
}
$("newBtn").addEventListener("click",function(){
  fetch("/api/rooms",{method:"POST"}).then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){enter(d.code)}).catch(function(){say("Couldn't create a budget. Try again.")});
});
$("joinBtn").addEventListener("click",function(){
  var c=norm($("joinCode").value);
  if(c.length!==8){$("joinErr").textContent="Enter the 8-character code.";return}
  code=c;
  api("GET","/api/data").then(function(){$("joinErr").textContent="";$("joinCode").value="";enter(c)})
    .catch(function(e){code="";$("joinErr").textContent=e.message==="auth"?"That code isn't right.":"Can't reach the server."});
});
$("copyBtn").addEventListener("click",function(){
  var msg="Join our shared budget: "+location.origin+"\nInvitation code: "+fmt(code);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(function(){say("Copied. Paste it to your partner.")},function(){say("Share this code with your partner: "+fmt(code))});
  }else say("Share this code with your partner: "+fmt(code));
});
$("leaveBtn").addEventListener("click",function(){
  if(confirm("Leave this budget on this device? You can rejoin any time with the invitation code."))showWelcome("You left this budget. Rejoin any time with its invitation code.");
});
function saveMe(){
  if(!me||!store)return;
  var inc=parseFloat($("myinc").value);
  store.setPerson(me,{name:$("myname").value.trim(),income:isNaN(inc)||inc<0?0:inc}).catch(fail);
}
document.querySelectorAll('input[name="me"]').forEach(function(r){
  r.addEventListener("change",function(){me=r.value;try{localStorage.setItem("budget2-me",me)}catch(e){}render()});
});
$("myname").addEventListener("change",saveMe);
$("myinc").addEventListener("change",saveMe);
$("form").addEventListener("submit",function(e){
  e.preventDefault();
  var desc=$("desc").value.trim(),amt=parseFloat($("amt").value);
  if(!me||!store){$("err").textContent="Choose who you are first.";return}
  if(!desc){$("err").textContent="Enter what the expense was for.";$("desc").focus();return}
  if(isNaN(amt)||amt<=0){$("err").textContent="Enter an amount greater than zero.";$("amt").focus();return}
  $("err").textContent="";
  store.addExpense({who:me,desc:desc,amt:Math.round(amt),cat:$("cat").value,ts:Date.now()})
    .then(function(){$("desc").value="";$("amt").value="";$("desc").focus();say("Added "+desc+".")}).catch(fail);
});
render();
var hm=location.hash.match(/code=([A-Za-z0-9-]+)/);
if(hm)$("joinCode").value=hm[1];
if(code)enter(code);else showWelcome();
</script>
</body>
</html>
